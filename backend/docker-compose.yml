services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: serviflow
      POSTGRES_PASSWORD: serviflow
      POSTGRES_DB: serviflow
    volumes:
      - serviflow_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serviflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://serviflow:serviflow@db:5432/serviflow
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  serviflow_pgdata:
